{% extends "base.html" %}

{% block title %}
404 - Página não encontrada
{% endblock %}

{% block content %}

<section class="error-section">

    <h1 class="error-code">
        404
    </h1>

    <h2>
        Página não encontrada
    </h2>

    <p>
        O recurso solicitado não existe
        ou não está disponível.
    </p>

    <a
        class="btn btn-primary"
        href="{{ url_for('site.home') }}"
    >
        Voltar ao início
    </a>

</section>

{% endblock %}
