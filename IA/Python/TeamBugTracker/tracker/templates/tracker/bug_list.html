{% extends 'tracker/base.html' %}
{% load static %}

{% block title %}
    {{ page_title }} - TeamBugTracker
{% endblock %}

{% block content %}

<section class="page-heading">

    <div>
        <h1>{{ page_title }}</h1>

        <p>
            Organização:
            <strong>{{ organization.name }}</strong>
        </p>
    </div>

    <a
        class="btn btn-primary"
        href="{% url 'tracker:bug_create' %}"
    >
        + Novo defeito
    </a>

</section>

<div
    id="bug-list-root"
    data-endpoint="{{ data_url }}"
    data-count-endpoint="{% url 'tracker:user_message_count' %}"
    data-mode="{{ list_mode }}"
>
    <div class="card app-card p-4">
        Carregando lista de defeitos.
    </div>
</div>

{% endblock %}

{% block extra_scripts %}

<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>

<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<script
    type="text/babel"
    src="{% static 'tracker/js/lists.jsx' %}"
></script>

{% endblock %}
